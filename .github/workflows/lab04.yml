name: CS61C Lab04 RISC-V calling convention
on:
  push:
    branches: [edidada/lab04]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lab04:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: bash scripts/verify_lab04.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cs61c-lab04-results
          path: test-results/
