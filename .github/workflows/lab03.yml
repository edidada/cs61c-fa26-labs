name: CS61C Lab03 RISC-V Venus
on:
  push:
    branches: [edidada/lab03]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lab03:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: npm install --no-save --package-lock=false playwright@1.56.1 && npx playwright install chromium
      - name: Run Venus exercises remotely
        run: bash scripts/verify_lab03.sh
      - name: Verify actual Venus browser
        run: node scripts/verify_lab03_browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cs61c-lab03-results
          path: |
            test-results/
            output/playwright/
