name: CS61C Lab05 digital circuits
on:
  push:
    branches: [edidada/lab05]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lab05:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: xvfb-run -a bash scripts/verify_lab05.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cs61c-lab05-results
          path: test-results/
